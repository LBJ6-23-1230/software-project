<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-label="图 1  用例与协作边界"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#136B58"/></marker><marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#136B58" stroke-width="1.5"/></marker></defs><style>text{font-family:'Microsoft YaHei','SimHei',Arial,sans-serif}*{box-sizing:border-box}</style><rect width="1440" height="1040" fill="#F5F7F9"/><text x="48" y="65" fill="#183335" font-size="36" font-weight="700" text-anchor="start"><tspan x="48" dy="0">图 1  用例与协作边界</tspan></text><text x="48" y="108" fill="#5D6D73" font-size="22" font-weight="400" text-anchor="start"><tspan x="48" dy="0">绿色：csw 负责的功能；灰色：其他成员接口。本轮改进不重新认领既有贡献。</tspan></text><rect x="275" y="150" width="940" height="740" rx="12" fill="#FFF" stroke="#A7B8B9" stroke-width="2" /><text x="300" y="187" fill="#183335" font-size="24" font-weight="700" text-anchor="start"><tspan x="300" dy="0">校园失物招领系统 · F04—F06 与必要集成</tspan></text><circle cx="110" cy="230" r="18" fill="#FFF" stroke="#183335" stroke-width="2.5"/><path d="M110 248v65 M74 272h72 M110 313l-32 48 M110 313l32 48" fill="none" stroke="#183335" stroke-width="2.3"  /><text x="110" y="399" fill="#183335" font-size="24" font-weight="700" text-anchor="middle"><tspan x="110" dy="0">访客</tspan></text><circle cx="110" cy="570" r="18" fill="#FFF" stroke="#183335" stroke-width="2.5"/><path d="M110 588v65 M74 612h72 M110 653l-32 48 M110 653l32 48" fill="none" stroke="#183335" stroke-width="2.3"  /><text x="110" y="739" fill="#183335" font-size="24" font-weight="700" text-anchor="middle"><tspan x="110" dy="0">校园用户</tspan></text><circle cx="1320" cy="285" r="18" fill="#FFF" stroke="#183335" stroke-width="2.5"/><path d="M1320 303v65 M1284 327h72 M1320 368l-32 4