<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-label="图 2  OOA 领域概念类图"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#136B58"/></marker><marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#136B58" stroke-width="1.5"/></marker></defs><style>text{font-family:'Microsoft YaHei','SimHei',Arial,sans-serif}*{box-sizing:border-box}</style><rect width="1440" height="1040" fill="#F5F7F9"/><text x="48" y="65" fill="#183335" font-size="36" font-weight="700" text-anchor="start"><tspan x="48" dy="0">图 2  OOA 领域概念类图</tspan></text><text x="48" y="108" fill="#5D6D73" font-size="22" font-weight="400" text-anchor="start"><tspan x="48" dy="0">概念关联与多重性用于分析业务；不表示源码中存在 User / Item / Claim 运行时类。</tspan></text><rect x="65" y="250" width="320" height="250" rx="12" fill="#FFF" stroke="#136B58" stroke-width="2" /><text x="225" y="286" fill="#183335" font-size="25" font-weight="700" text-anchor="middle"><tspan x="225" dy="0">User · 校园用户</tspan></text><text x="85" y="323" fill="#183335" font-size="22" font-weight="400" text-anchor="start"><tspan x="85" dy="0">id、昵称、角色</tspan><tspan x="85" dy="31">拥有发布记录</tspan><tspan x="85" dy="31">可作为认领申请人</tspan><tspan x="85" dy="31">身份来自服务端会话</tspan></text><rect x="550" y="210" width="410" height="370" rx="12" fill="#FFF" stroke="#136B58" stroke-width="2" /><text x="755" y="246" fill="#183335" font-size="25" font-weight="700" text-anchor="middle"><tspan x="755" dy="0">Item · 物品信息</tspan></text><text x="570" y="283" fill="#183335" font-size="22" font-weight="400" text-anchor="start"><tspan x="570" dy="0">id、ownerId</tspan><tspan x="570" dy="31">type：lost / found</tspan><tspan x="570" dy="31">标题、类别、时间、地点</tspan><tspan x="570" dy="31">描述、图片、校区</tspan><tspan x="570" dy="31">status：生命周期</tspan><tspan x="570" dy="31">reviewStatus：审核状态</tspan><tspan x="570" dy="31">两维状态分别维护</tspan></text><rect x="1120" y="250" width="270" height="280" rx="12" fill="#FFF" stroke="#136B58" stroke-width="2" /><text x="1255" y="286" fill="#183335" font-size="25" font-weight="700" text-anchor="middle"><tspan x="1255" dy="0">Claim · 认领申请</tspan></text><text x="1140" y="323" fill="#183335" font-size="22" font-weight="400" text-anchor="start"><tspan x="1140" dy="0">id、itemId</tspan><tspan x="1140" dy="31">applicantId、ownerId</tspan><tspan x="1140" dy="31">认领证明与处理状态</tspan><tspan x="1140" dy="31">申请与物品信息分离</tspan></text><path d="M 65 298 L 385 298" fill="none" stroke="#A7B8B9" stroke-width="2.3"  /><path d="M 550 258 L 960 258" fill="none" stroke="#A7B8B9" stroke-width="2.3"  /><path d="M 1120 298 L 1390 298" fill="none" stroke="#A7B8B9" stroke-width="2.3"  /><path d="M 385 350 L 550 350" fill="none" stroke="#136B58" stroke-width="2.3"  /><text x="423" y="320" fill="#183335" font-size="23" font-weight="400" text-anchor="start"><tspan x="423" dy="0">发布</tspan></text><text x="398" y="385" fill="#183335" font-size="22" font-weight="400" text-anchor="start"><tspan x="398" dy="0">1</tspan></text><text x="490" y="385" fill="#183335" font-size="22" font-weight="400" text-anchor="start"><tspan x="490" dy="0">0..*</tspan></text><path d="M 960 350 L 1120 350" fill="none" stroke="#136B58" stroke-width="2.3"  /><text x="995" y="320" fill="#183335" font-size="23" font-weight="400" text-anchor="start"><tspan x="995" dy="0">关联</tspan></text><text x="976" y="385" fill="#183335" font-size="22" font-weight="400" text-anchor="start"><tspan x="976" dy="0">1</tspan></text><text x="1065" y="385" fill="#183335" font-size="22" font-weight="400" text-anchor="start"><tspan x="1065" dy="0">0..*</tspan></text><path d="M225 500 L225 700 L1255 700 L1255 530" fill="none" stroke="#136B58" stroke-width="2.3"  /><text x="590" y="683" fill="#183335" font-size="23" font-weight="400" text-anchor="start"><tspan x="590" dy="0">申请：User 1  ↔  Claim 0..*</tspan></text><rect x="65" y="785" width="1325" height="125" rx="12" fill="#E5F0E9" stroke="#136B58" stroke-width="2" /><text x="727.5" y="821" fill="#183335" font-size="25" font-weight="700" text-anchor="middle"><tspan x="727.5" dy="0">业务不变量</tspan></text><text x="85" y="858" fill="#183335" font-size="22" font-weight="400" text-anchor="start"><tspan x="85" dy="0">同物品最多一笔有效完成；活跃认领阻止编辑 / 撤回；公开数据必须通过审核且未撤回。</tspan></text><path d="M 48 967 L 1392 967" fill="none" stroke="#A7B8B9" stroke-width="2.3"  /><text x="48" y="1009" fill="#5D6D73" font-size="20" font-weight="400" text-anchor="start"><tspan x="48" dy="0">概念模型 · 实际载体是 TypeScript interface、函数组件、路由与 SQLite 关系表。</tspan></text></svg>