<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-label="图 3  OOD 实际组件与模块依赖"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#136B58"/></marker><marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#136B58" stroke-width="1.5"/></marker></defs><style>text{font-family:'Microsoft YaHei','SimHei',Arial,sans-serif}*{box-sizing:border-box}</style><rect width="1440" height="1040" fill="#F5F7F9"/><text x="48" y="65" fill="#183335" font-size="36" font-weight="700" text-anchor="start"><tspan x="48" dy="0">图 3  OOD 实际组件与模块依赖</tspan></text><text x="48" y="108" fill="#5D6D73" font-size="22" font-weight="400" text-anchor="start"><tspan x="48" dy="0">实线为调用 / 渲染依赖；虚线为类型或辅助模块依赖。未新增 API、运行时类或数据库表。</tspan></text><rect x="40" y="165" width="870" height="745" rx="12" fill="#FFF" stroke="#A7B8B9" stroke-width="2" /><text x="65" y="204" fill="#183335" font-size="23" font-weight="700" text-anchor="start"><tspan x="65" dy="0">浏览器 / React</tspan></text><rect x="970" y="165" width="430" height="745" rx="12" fill="#FFF" stroke="#A7B8B9" stroke-width="2" /><text x="995" y="204" fill="#183335" font-size="23" font-weight="700" text-anchor="start"><tspan x="995" dy="0">服务端 / Express + SQLite</tspan></text><rect x="75" y="240" width="330" height="105" rx="12" fill="#FFF" stroke="#136B58" stroke-width="2" /><text x="240" y="276" fill="#183335" font-size="24" font-weight="700" text-anchor="middle"><tspan x="240" dy="0">App · 函数组件</tspan></text><text x="95" y="313" fill="#183335" font-size="20" font-weight="400" text-anchor="start"><tspan x="95" dy="0">导航、editing 与回调交接</tspan></text><rect x="75" y="415" width="330" height="120" rx="12" fill="#FFF" stroke="#136B58" stroke-width="2" /><text x="240" y="451" fill="#183335" font-size="24" font-weight="700" text-anchor="middle"><tspan x="240" dy="0">Explore · 函数组件</tspan></text><text x="95" y="488" fill="#183335" font-size="20" font-weight="400" text-anchor="start"><tspan x="95" dy="0">列表、选中 ID、ItemDetail</tspan><tspan x="95" dy="31">加载 / 失败 / 重试</tspan></text><rect x="75" y="615" width="330" height="120" rx="12" fill="#FFF" stroke="#136B58" stroke-width="2" /><text x="240" y="651" fill="#183335" font-size="24" font-weight="700" text-anchor="middle"><tspan x="240" dy="0">Publish · 函数组件</tspan></text><text x="95" y="688" fill="#183335" font-size="20" font-weight="400" text-anchor="start"><tspan x="95" dy="0">用途告知与表单状态</tspan><tspan x="95" dy="31">POST / PATCH</tspan></text><rect x="535" y="420" width="320" height="130" rx="12" fill="#FFF" stroke="#136B58" stroke-width="2" /><text x="695" y="456" fill="#183335" font-size="22" font-weight="700" text-anchor="middle"><tspan x="695" dy="0">«module» api/client.ts</tspan></text><text x="555" y="493" fill="#183335" font-size="20" font-weight="400" text-anchor="start"><tspan x="555" dy="0">api&lt;T&gt;、post、patch</tspan><tspan x="555" dy="31">请求、会话头与错误转换</tspan></text><rect x="535" y="240" width="320" height="115" rx="12" fill="#E5F0E9" stroke="#136B58" stroke-width="2" /><text x="695" y="276" fill="#183335" font-size="21" font-weight="700" text-anchor="middle"><tspan x="695" dy="0">«interface» shared/types</tspan></text><text x="555" y="313" fill="#183335" font-size="20" font-weight="400" text-anchor="start"><tspan x="555" dy="0">Item / ItemInput / ItemPage</tspan><tspan x="555" dy="31">仅编译期类型，无运行时类</tspan></text><rect x="1010" y="420" width="350" height="130" rx="12" fill="#FFF" stroke="#136B58" stroke-width="2" /><text x="1185" y="456" fill="#183335" font-size="23" font-weight="700" text-anchor="middle"><tspan x="1185" dy="0">registerItemRoutes()</tspan></text><text x="1030" y="493" fill="#183335" font-size="20" font-weight="400" text-anchor="start"><tspan x="1030" dy="0">«function» GET / POST / PATCH</tspan><tspan x="1030" dy="31">validateItem 与本人权限</tspan></text><rect x="1010" y="615" width="350" height="110" rx="12" fill="#FFF" stroke="#136B58" stroke-width="2" /><text x="1185" y="651" fill="#183335" font-size="22" font-weight="700" text-anchor="middle"><tspan x="1185" dy="0">«module» common.ts</tspan></text><text x="1030" y="688" fill="#183335" font-size="20" font-weight="400" text-anchor="start"><tspan x="1030" dy="0">身份、可见性、活跃认领检查</tspan></text><rect x="1010" y="790" width="350" height="95" rx="12" fill="#FFF" stroke="#136B58" stroke-width="2" /><text x="1185" y="826" fill="#183335" font-size="22" font-weight="700" text-anchor="middle"><tspan x="1185" dy="0">«database» SQLite</tspan></text><text x="1030" y="863" fill="#183335" font-size="20" font-weight="400" text-anchor="start"><tspan x="1030" dy="0">items · users · claims</tspan></text><path d="M 240 345 L 240 415" fill="none" stroke="#136B58" stroke-width="2.3"  marker-end="url(#arrow)"/><path d="M120 345 L120 380 L50 380 L50 675 L75 675" fill="none" stroke="#136B58" stroke-width="2.3"  marker-end="url(#arrow)"/><path d="M 405 470 L 535 470" fill="none" stroke="#136B58" stroke-width="2.3"  marker-end="url(#arrow)"/><path d="M405 675 L475 675 L475 515 L535 515" fill="none" stroke="#136B58" stroke-width="2.3"  marker-end="url(#arrow)"/><path d="M 855 485 L 1010 485" fill="none" stroke="#136B58" stroke-width="2.3"  marker-end="url(#arrow)"/><text x="882" y="453" fill="#183335" font-size="21" font-weight="400" text-anchor="start"><tspan x="882" dy="0">HTTP</tspan></text><path d="M 405 455 L 535 300" fill="none" stroke="#136B58" stroke-width="2.3" stroke-dasharray="9 7" marker-end="url(#open)"/><path d="M405 655 L450 585 L600 355" fill="none" stroke="#136B58" stroke-width="2.3" stroke-dasharray="9 7" marker-end="url(#open)"/><path d="M 1085 420 L 855 300" fill="none" stroke="#136B58" stroke-width="2.3" stroke-dasharray="9 7" marker-end="url(#open)"/><path d="M 1180 550 L 1180 615" fill="none" stroke="#136B58" stroke-width="2.3" stroke-dasharray="9 7" marker-end="url(#open)"/><path d="M1360 515 L1380 515 L1380 840 L1360 840" fill="none" stroke="#136B58" stroke-width="2.3"  marker-end="url(#arrow)"/><text x="80" y="811" fill="#5D6D73" font-size="22" font-weight="400" text-anchor="start"><tspan x="80" dy="0">集成：Profile（xzh 既有）提供编辑 / 撤回入口；</tspan><tspan x="80" dy="35">F07 认领与 F10 审核继续由对应模块负责。</tspan></text><path d="M 48 967 L 1392 967" fill="none" stroke="#A7B8B9" stroke-width="2.3"  /><text x="48" y="1009" fill="#5D6D73" font-size="20" font-weight="400" text-anchor="start"><tspan x="48" dy="0">设计模型 · 类型接口描述数据形状；组件管理界面状态；业务不变量由服务端最终校验。</tspan></text></svg>