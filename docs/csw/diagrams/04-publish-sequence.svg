<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-label="图 4  F04 发布成功与验证边界序列"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#136B58"/></marker><marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#136B58" stroke-width="1.5"/></marker></defs><style>text{font-family:'Microsoft YaHei','SimHei',Arial,sans-serif}*{box-sizing:border-box}</style><rect width="1440" height="1040" fill="#F5F7F9"/><text x="48" y="65" fill="#183335" font-size="36" font-weight="700" text-anchor="start"><tspan x="48" dy="0">图 4  F04 发布成功与验证边界序列</tspan></text><text x="48" y="108" fill="#5D6D73" font-size="22" font-weight="400" text-anchor="start"><tspan x="48" dy="0">前端说明用途并约束输入；服务端从会话获取身份，创建记录后仍须由 gbl 的 F10 审核。</tspan></text><rect x="35" y="165" width="280" height="100" rx="12" fill="#FFF" stroke="#136B58" stroke-width="2" /><text x="175" y="201" fill="#183335" font-size="22" font-weight="700" text-anchor="middle"><tspan x="175" dy="0">校园用户</tspan></text><text x="55" y="238" fill="#183335" font-size="18" font-weight="400" text-anchor="start"></text><path d="M 175 265 L 175 880" fill="none" stroke="#A7B8B9" stroke-width="2.3" stroke-dasharray="9 7" /><rect x="380" y="165" width="280" height="100" rx="12" fill="#FFF" stroke="#136B58" stroke-width="2" /><text x="520" y="201" fill="#183335" font-size="22" font-weight="700" text-anchor="middle"><tspan x="520" dy="0">Publish 函数组件</tspan></text><text x="400" y="238" fill="#183335" font-size="18" font-weight="400" text-anchor="start"></text><path d="M 520 265 L 520 880" fill="none" stroke="#A7B8B9" stroke-width="2.3" stroke-dasharray="9 7" /><rect x="735" y="165" width="280" height="100" rx="12" fill="#FFF" stroke="#136B58" stroke-width="2" /><text x="875" y="201" fill="#183335" font-size="22" font-weight="700" text-anchor="middle"><tspan x="875" dy="0">API / items 路由</tspan></text><text x="755" y="238" fill="#183335" font-size="18" font-weight="400" text-anchor="start"></text><path d="M 875 265 L 875 880" fill="none" stroke="#A7B8B9" stroke-width="2.3" stroke-dasharray="9 7" /><rect x="1090" y="165" width="280" height="100" rx="12" fill="#FFF" stroke="#136B58" stroke-width="2" /><text x="1230" y="201" fill="#183335" font-size="22" font-weight="700" text-anchor="middle"><tspan x="1230" dy="0">SQLite</tspan></text><text x="1110" y="238" fill="#183335" font-size="18" font-weight="400" text-anchor="start"></text><path d="M 1230 265 L 1230 880" fill="none" stroke="#A7B8B9" stroke-width="2.3" stroke-dasharray="9 7" /><path d="M 175 325 L 520 325" fill="none" stroke="#136B58" stroke-width="2.3"  marker-end="url(#arrow)"/><text x="347.5" y="310" fill="#183335" font-size="22" font-weight="400" text-anchor="middle"><tspan x="347.5" dy="0">阅读告知、填写并提交</tspan></text><path d="M 520 405 L 875 405" fill="none" stroke="#136B58" stroke-width="2.3"  marker-end="url(#arrow)"/><text x="697.5" y="390" fill="#183335" font-size="22" font-weight="400" text-anchor="middle"><tspan x="697.5" dy="0">POST /items + ItemInput</tspan></text><rect x="745" y="440" width="260" height="76" rx="12" fill="#E5F0E9" stroke="#136B58" stroke-width="2" /><text x="875" y="471" fill="#183335" font-size="21" font-weight="400" text-anchor="middle"><tspan x="875" dy="0">requireUser</tspan><tspan x="875" dy="27">validateItem</tspan></text><path d="M 875 560 L 1230 560" fill="none" stroke="#136B58" stroke-width="2.3"  marker-end="url(#arrow)"/><text x="1052.5" y="545" fill="#183335" font-size="22" font-weight="400" text-anchor="middle"><tspan x="1052.5" dy="0">INSERT：active + pending</tspan></text><path d="M 1230 635 L 875 635" fill="none" stroke="#136B58" stroke-width="2.3" stroke-dasharray="9 7" marker-end="url(#open)"/><text x="1052.5" y="620" fill="#183335" font-size="22" font-weight="400" text-anchor="middle"><tspan x="1052.5" dy="0">已保存 Item</tspan></text><path d="M 875 705 L 520 705" fill="none" stroke="#136B58" stroke-width="2.3" stroke-dasharray="9 7" marker-end="url(#open)"/><text x="697.5" y="690" fill="#183335" font-size="22" font-weight="400" text-anchor="middle"><tspan x="697.5" dy="0">201 Item（待审核）</tspan></text><path d="M 520 790 L 175 790" fill="none" stroke="#136B58" stroke-width="2.3" stroke-dasharray="9 7" marker-end="url(#open)"/><text x="347.5" y="775" fill="#183335" font-size="21" font-weight="400" text-anchor="middle"><tspan x="347.5" dy="0">onDone：进入本人发布记录</tspan></text><rect x="70" y="870" width="1300" height="62" rx="12" fill="#FFF" stroke="#A7B8B9" stroke-width="2" /><text x="95" y="909" fill="#183335" font-size="23" font-weight="400" text-anchor="start"><tspan x="95" dy="0">异常：未登录 / 输入无效 → 401 / 400 + 错误说明；界面保留表单，服务端拒绝写入。</tspan></text><path d="M 48 967 L 1392 967" fill="none" stroke="#A7B8B9" stroke-width="2.3"  /><text x="48" y="1009" fill="#5D6D73" font-size="20" font-weight="400" text-anchor="start"><tspan x="48" dy="0">序列视图 · 图中 API 合并表示现有请求客户端与服务端边界；管理员审核不是发布接口自动完成。</tspan></text></svg>