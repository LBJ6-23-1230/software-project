<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-label="图 5  F05 详情异常与同物品重试序列"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#136B58"/></marker><marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#136B58" stroke-width="1.5"/></marker></defs><style>text{font-family:'Microsoft YaHei','SimHei',Arial,sans-serif}*{box-sizing:border-box}</style><rect width="1440" height="1040" fill="#F5F7F9"/><text x="48" y="65" fill="#183335" font-size="36" font-weight="700" text-anchor="start"><tspan x="48" dy="0">图 5  F05 详情异常与同物品重试序列</tspan></text><text x="48" y="108" fill="#5D6D73" font-size="22" font-weight="400" text-anchor="start"><tspan x="48" dy="0">卡片 / 推荐只提供选中标识。每次选择、返回、重试均重新读取；失败不能退回旧快照。</tspan></text><rect x="70" y="165" width="280" height="100" rx="12" fill="#FFF" stroke="#136B58" stroke-width="2" /><text x="210" y="201" fill="#183335" font-size="22" font-weight="700" text-anchor="middle"><tspan x="210" dy="0">校园用户</tspan></text><text x="90" y="238" fill="#183335" font-size="18" font-weight="400" text-anchor="start"></text><path d="M 210 265 L 210 920" fill="none" stroke="#A7B8B9" stroke-width="2.3" stroke-dasharray="9 7" /><rect x="560" y="165" width="280" height="100" rx="12" fill="#FFF" stroke="#136B58" stroke-width="2" /><text x="700" y="201" fill="#183335" font-size="22" font-weight="700" text-anchor="middle"><tspan x="700" dy="0">ItemDetail 函数组件</tspan></text><text x="580" y="238" fill="#183335" font-size="18" font-weight="400" text-anchor="start"></text><path d="M 700 265 L 700 920" fill="none" stroke="#A7B8B9" stroke-width="2.3" stroke-dasharray="9 7" /><rect x="1070" y="165" width="280" height="100" rx="12" fill="#FFF" stroke="#136B58" stroke-width="2" /><text x="1210" y="201" fill="#183335" font-size="22" font-weight="700" text-anchor="middle"><tspan x="1210" dy="0">GET /items/:id</tspan></text><text x="1090" y="238" fill="#183335" font-size="18" font-weight="400" text-anchor="start"></text><path d="M 1210 265 L 1210 920" fill="none" stroke="#A7B8B9" stroke-width="2.3" stroke-dasharray="9 7" /><path d="M 210 315 L 700 315" fill="none" stroke="#136B58" stroke-width="2.3"  marker-end="url(#arrow)"/><text x="455" y="300" fill="#183335" font-size="22" font-weight="400" text-anchor="middle"><tspan x="455" dy="0">选择物品 ID</tspan></text><path d="M 700 385 L 1210 385" fill="none" stroke="#136B58" stroke-width="2.3"  marker-end="url(#arrow)"/><text x="955" y="370" fill="#183335" font-size="22" font-weight="400" text-anchor="middle"><tspan x="955" dy="0">清空旧 current；发起详情请求</tspan></text><path d="M 1210 465 L 700 465" fill="none" stroke="#136B58" stroke-width="2.3" stroke-dasharray="9 7" marker-end="url(#open)"/><text x="955" y="450" fill="#183335" font-size="22" font-weight="400" text-anchor="middle"><tspan x="955" dy="0">404 / 网络失败</tspan></text><path d="M 700 540 L 210 540" fill="none" stroke="#136B58" stroke-width="2.3" stroke-dasharray="9 7" marker-end="url(#open)"/><text x="455" y="525" fill="#183335" font-size="21" font-weight="400" text-anchor="middle"><tspan x="455" dy="0">聚焦错误；隐藏旧详情与认领表单</tspan></text><path d="M 210 615 L 700 615" fill="none" stroke="#136B58" stroke-width="2.3"  marker-end="url(#arrow)"/><text x="455" y="600" fill="#183335" font-size="22" font-weight="400" text-anchor="middle"><tspan x="455" dy="0">点击“重试加载详情”</tspan></text><path d="M 700 690 L 1210 690" fill="none" stroke="#136B58" stroke-width="2.3"  marker-end="url(#arrow)"/><text x="955" y="675" fill="#183335" font-size="22" font-weight="400" text-anchor="middle"><tspan x="955" dy="0">相同 selectedId，再次 GET</tspan></text><path d="M 1210 765 L 700 765" fill="none" stroke="#136B58" stroke-width="2.3" stroke-dasharray="9 7" marker-end="url(#open)"/><text x="955" y="750" fill="#183335" font-size="22" font-weight="400" text-anchor="middle"><tspan x="955" dy="0">返回当前有效 Item</tspan></text><path d="M 700 845 L 210 845" fill="none" stroke="#136B58" stroke-width="2.3" stroke-dasharray="9 7" marker-end="url(#open)"/><text x="455" y="830" fill="#183335" font-size="21" font-weight="400" text-anchor="middle"><tspan x="455" dy="0">成功态渲染；满足条件才开放认领</tspan></text><path d="M 48 967 L 1392 967" fill="none" stroke="#A7B8B9" stroke-width="2.3"  /><text x="48" y="1009" fill="#5D6D73" font-size="20" font-weight="400" text-anchor="start"><tspan x="48" dy="0">并发保护 · effect 清理时 abort；alive 检查阻止过时响应更新状态。推荐请求仅在详情成功后发起。</tspan></text></svg>