<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-label="图 6  生命周期与审核的两维状态机"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#136B58"/></marker><marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#136B58" stroke-width="1.5"/></marker></defs><style>text{font-family:'Microsoft YaHei','SimHei',Arial,sans-serif}*{box-sizing:border-box}</style><rect width="1440" height="1040" fill="#F5F7F9"/><text x="48" y="65" fill="#183335" font-size="36" font-weight="700" text-anchor="start"><tspan x="48" dy="0">图 6  生命周期与审核的两维状态机</tspan></text><text x="48" y="108" fill="#5D6D73" font-size="22" font-weight="400" text-anchor="start"><tspan x="48" dy="0">type（lost / found）是信息类型；此图概括主要转移，未穷尽管理员复核与状态自环。</tspan></text><rect x="45" y="165" width="1350" height="745" rx="12" fill="#FFF" stroke="#A7B8B9" stroke-width="2" /><text x="70" y="209" fill="#183335" font-size="25" font-weight="700" text-anchor="start"><tspan x="70" dy="0">Item 的两个正交状态维度</tspan></text><path d="M 710 235 L 710 860" fill="none" stroke="#A7B8B9" stroke-width="2.3" stroke-dasharray="9 7" /><text x="85" y="265" fill="#183335" font-size="26" font-weight="700" text-anchor="start"><tspan x="85" dy="0">status · 生命周期</tspan></text><text x="755" y="265" fill="#183335" font-size="26" font-weight="700" text-anchor="start"><tspan x="755" dy="0">reviewStatus · 审核状态</tspan></text><circle cx="360" cy="305" r="9" fill="#183335"/><path d="M 360 315 L 360 350" fill="none" stroke="#136B58" stroke-width="2.3"  marker-end="url(#arrow)"/><rect x="225" y="350" width="270" height="100" rx="12" fill="#E5F0E9" stroke="#136B58" stroke-width="2" /><text x="360" y="386" fill="#183335" font-size="25" font-weight="700" text-anchor="middle"><tspan x="360" dy="0">active</tspan></text><text x="245" y="423" fill="#183335" font-size="22" font-weight="400" text-anchor="start"><tspan x="245" dy="0">仍在寻找 / 招领</tspan></text><rect x="85" y="675" width="235" height="100" rx="12" fill="#FFF" stroke="#136B58" stroke-width="2" /><text x="202.5" y="711" fill="#183335" font-size="25" font-weight="700" text-anchor="middle"><tspan x="202.5" dy="0">withdrawn</tspan></text><text x="105" y="748" fill="#183335" font-size="22" font-weight="400" text-anchor="start"><tspan x="105" dy="0">发布者撤回</tspan></text><rect x="420" y="675" width="235" height="100" rx="12" fill="#FFF" stroke="#136B58" stroke-width="2" /><text x="537.5" y="711" fill="#183335" font-size="25" font-weight="700" text-anchor="middle"><tspan x="537.5" dy="0">claimed</tspan></text><text x="440" y="748" fill="#183335" font-size="22" font-weight="400" text-anchor="start"><tspan x="440" dy="0">认领完成 / 已归还</tspan></text><path d="M285 450 L205 585 L205 675" fill="none" stroke="#136B58" stroke-width="2.3"  marker-end="url(#arrow)"/><text x="75" y="535" fill="#183335" font-size="22" font-weight="400" text-anchor="start"><tspan x="75" dy="0">F06 本人撤回</tspan><tspan x="75" dy="35">无进行中认领</tspan></text><path d="M430 450 L540 585 L540 675" fill="none" stroke="#136B58" stroke-width="2.3"  marker-end="url(#arrow)"/><text x="425" y="535" fill="#183335" font-size="22" font-weight="400" text-anchor="start"><tspan x="425" dy="0">F07 完成交接</tspan><tspan x="425" dy="35">stt 既有流程</tspan></text><text x="88" y="839" fill="#5D6D73" font-size="21" font-weight="400" text-anchor="start"><tspan x="88" dy="0">撤回不物理删除；当前没有本人恢复入口。</tspan><tspan x="88" dy="30">两种终态均拒绝本人继续编辑 / 撤回。</tspan></text><circle cx="1045" cy="305" r="9" fill="#183335"/><path d="M 1045 315 L 1045 350" fill="none" stroke="#136B58" stroke-width="2.3"  marker-end="url(#arrow)"/><rect x="910" y="350" width="270" height="100" rx="12" fill="#E5F0E9" stroke="#136B58" stroke-width="2" /><text x="1045" y="386" fill="#183335" font-size="25" font-weight="700" text-anchor="middle"><tspan x="1045" dy="0">pending</tspan></text><text x="930" y="423" fill="#183335" font-size="22" font-weight="400" text-anchor="start"><tspan x="930" dy="0">发布或编辑后待审核</tspan></text><rect x="785" y="675" width="230" height="100" rx="12" fill="#FFF" stroke="#136B58" stroke-width="2" /><text x="900" y="711" fill="#183335" font-size="25" font-weight="700" text-anchor="middle"><tspan x="900" dy="0">approved</tspan></text><text x="805" y="748" fill="#183335" font-size="22" font-weight="400" text-anchor="start"><tspan x="805" dy="0">管理员批准</tspan></text><rect x="1110" y="675" width="230" height="100" rx="12" fill="#FFF" stroke="#136B58" stroke-width="2" /><text x="1225" y="711" fill="#183335" font-size="25" font-weight="700" text-anchor="middle"><tspan x="1225" dy="0">rejected</tspan></text><text x="1130" y="748" fill="#183335" font-size="22" font-weight="400" text-anchor="start"><tspan x="1130" dy="0">驳回 / 下架</tspan></text><path d="M995 450 L900 585 L900 675" fill="none" stroke="#136B58" stroke-width="2.3"  marker-end="url(#arrow)"/><text x="790" y="535" fill="#183335" font-size="22" font-weight="400" text-anchor="start"><tspan x="790" dy="0">F10 批准</tspan></text><path d="M1100 450 L1225 585 L1225 675" fill="none" stroke="#136B58" stroke-width="2.3"  marker-end="url(#arrow)"/><text x="1160" y="535" fill="#183335" font-size="22" font-weight="400" text-anchor="start"><tspan x="1160" dy="0">F10 驳回</tspan></text><path d="M785 715 L752 715 L752 400 L910 400" fill="none" stroke="#136B58" stroke-width="2.3"  marker-end="url(#arrow)"/><text x="778" y="615" fill="#5D6D73" font-size="20" font-weight="400" text-anchor="start"><tspan x="778" dy="0">编辑 → 重审</tspan></text><path d="M1340 715 L1370 715 L1370 400 L1180 400" fill="none" stroke="#136B58" stroke-width="2.3"  marker-end="url(#arrow)"/><text x="1175" y="615" fill="#5D6D73" font-size="20" font-weight="400" text-anchor="start"><tspan x="1175" dy="0">编辑 → 重审</tspan></text><path d="M 1015 725 L 1110 725" fill="none" stroke="#136B58" stroke-width="2.3"  marker-end="url(#arrow)"/><text x="1065" y="810" fill="#5D6D73" font-size="20" font-weight="400" text-anchor="middle"><tspan x="1065" dy="0">F10 下架</tspan></text><text x="755" y="839" fill="#5D6D73" font-size="21" font-weight="400" text-anchor="start"><tspan x="755" dy="0">公开：approved 且 status ≠ withdrawn。</tspan><tspan x="755" dy="30">仍需单独检查认领类型与生命周期。</tspan></text><path d="M 48 967 L 1392 967" fill="none" stroke="#A7B8B9" stroke-width="2.3"  /><text x="48" y="1009" fill="#5D6D73" font-size="20" font-weight="400" text-anchor="start"><tspan x="48" dy="0">图示范围 · F10 治理和 F07 认领均沿用既有模块；带认领 / 终态限制由服务端校验，不由前端单独保证。</tspan></text></svg>