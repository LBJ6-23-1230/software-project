<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-label="图 7  F05 查询、失败与恢复活动图"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#136B58"/></marker><marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#136B58" stroke-width="1.5"/></marker></defs><style>text{font-family:'Microsoft YaHei','SimHei',Arial,sans-serif}*{box-sizing:border-box}</style><rect width="1440" height="1040" fill="#F5F7F9"/><text x="48" y="65" fill="#183335" font-size="36" font-weight="700" text-anchor="start"><tspan x="48" dy="0">图 7  F05 查询、失败与恢复活动图</tspan></text><text x="48" y="108" fill="#5D6D73" font-size="22" font-weight="400" text-anchor="start"><tspan x="48" dy="0">可恢复失败是一条正常交互路径；明确的重试触发量让相同参数也能再次请求。</tspan></text><circle cx="720" cy="180" r="9" fill="#183335"/><path d="M 720 190 L 720 225" fill="none" stroke="#136B58" stroke-width="2.3"  marker-end="url(#arrow)"/><rect x="510" y="225" width="420" height="90" rx="12" fill="#FFF" stroke="#136B58" stroke-width="2" /><text x="720" y="261" fill="#183335" font-size="25" font-weight="700" text-anchor="middle"><tspan x="720" dy="0">输入 / 筛选 / 翻页 / 重试</tspan></text><text x="530" y="298" fill="#183335" font-size="22" font-weight="400" text-anchor="start"><tspan x="530" dy="0">保持当前查询参数</tspan></text><path d="M 720 315 L 720 360" fill="none" stroke="#136B58" stroke-width="2.3"  marker-end="url(#arrow)"/><rect x="510" y="360" width="420" height="90" rx="12" fill="#FFF" stroke="#136B58" stroke-width="2" /><text x="720" y="396" fill="#183335" font-size="25" font-weight="700" text-anchor="middle"><tspan x="720" dy="0">清空旧结果，进入 loading</tspan></text><text x="530" y="433" fill="#183335" font-size="22" font-weight="400" text-anchor="start"><tspan x="530" dy="0">新请求携带 AbortSignal</tspan></text><path d="M 720 450 L 720 495" fill="none" stroke="#136B58" stroke-width="2.3"  marker-end="url(#arrow)"/><rect x="510" y="495" width="420" height="80" rx="12" fill="#FFF" stroke="#136B58" stroke-width="2" /><text x="720" y="531" fill="#183335" font-size="25" font-weight="700" text-anchor="middle"><tspan x="720" dy="0">GET /items?查询参数</tspan></text><text x="530" y="568" fill="#183335" font-size="22" font-weight="400" text-anchor="start"></text><path d="M 720 575 L 720 610" fill="none" stroke="#136B58" stroke-width="2.3"  marker-end="url(#arrow)"/><polygon points="720,610 820,665 720,720 620,665" fill="#E5F0E9" stroke="#136B58" stroke-width="2"/><text x="720" y="674" fill="#183335" font-size="23" font-weight="400" text-anchor="middle"><tspan x="720" dy="0">请求成功？</tspan></text><path d="M620 665 L280 665 L280 745" fill="none" stroke="#136B58" stroke-width="2.3"  marker-end="url(#arrow)"/><text x="470" y="643" fill="#183335" font-size="24" font-weight="400" text-anchor="start"><tspan x="470" dy="0">否</tspan></text><rect x="85" y="745" width="390" height="100" rx="12" fill="#FFF" stroke="#136B58" stroke-width="2" /><text x="280" y="781" fill="#183335" font-size="25" font-weight="700" text-anchor="middle"><tspan x="280" dy="0">失败：显示可读错误</tspan></text><text x="105" y="818" fill="#183335" font-size="22" font-weight="400" text-anchor="start"><tspan x="105" dy="0">无旧卡片；提供同条件重试</tspan></text><path d="M820 665 L1120 665 L1120 745" fill="none" stroke="#136B58" stroke-width="2.3"  marker-end="url(#arrow)"/><text x="955" y="643" fill="#183335" font-size="24" font-weight="400" text-anchor="start"><tspan x="955" dy="0">是</tspan></text><rect x="935" y="745" width="390" height="100" rx="12" fill="#FFF" stroke="#136B58" stroke-width="2" /><text x="1130" y="781" fill="#183335" font-size="25" font-weight="700" text-anchor="middle"><tspan x="1130" dy="0">成功：渲染本次结果</tspan></text><text x="955" y="818" fill="#183335" font-size="22" font-weight="400" text-anchor="start"><tspan x="955" dy="0">卡片 / 分页，或空结果提示</tspan></text><path d="M85 795 L55 795 L55 270 L510 270" fill="none" stroke="#136B58" stroke-width="2.3"  marker-end="url(#arrow)"/><text x="75" y="390" fill="#183335" font-size="23" font-weight="400" text-anchor="start"><tspan x="75" dy="0">用户点击</tspan><tspan x="75" dy="35">重新加载列表</tspan></text><path d="M 1120 845 L 1120 895" fill="none" stroke="#136B58" stroke-width="2.3"  marker-end="url(#arrow)"/><circle cx="1120" cy="909" r="14" fill="none" stroke="#183335" stroke-width="2"/><circle cx="1120" cy="909" r="8" fill="#183335"/><rect x="1010" y="275" width="360" height="165" rx="12" fill="#FFF" stroke="#A7B8B9" stroke-width="2" /><text x="1190" y="311" fill="#183335" font-size="23" font-weight="700" text-anchor="middle"><tspan x="1190" dy="0">过时请求清理</tspan></text><text x="1030" y="348" fill="#183335" font-size="20" font-weight="400" text-anchor="start"><tspan x="1030" dy="0">筛选 / 页码变化或卸载</tspan><tspan x="1030" dy="31">alive=false + abort()</tspan><tspan x="1030" dy="31">晚到结果不能替换新查询</tspan></text><path d="M 48 967 L 1392 967" fill="none" stroke="#A7B8B9" stroke-width="2.3"  /><text x="48" y="1009" fill="#5D6D73" font-size="20" font-weight="400" text-anchor="start"><tspan x="48" dy="0">活动视图 · 未实现自动重试、退避或网络超时策略；本图不代表已完成真实弱网性能验收。</tspan></text></svg>