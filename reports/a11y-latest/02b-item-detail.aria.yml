    - heading "拾到物品，怎么办？" [level=3]
    - paragraph: 你的一点帮助， 可能是别人一整天的幸运。
    - list:
      - listitem: 1 发布招领信息 描述物品与拾取地点
      - listitem: 2 核对认领信息 保留关键特征用于验证
      - listitem: 3 安心完成归还 当面核验，在系统确认
    - button "我拾到了物品"
    - heading "让善意，也有保障" [level=3]
    - paragraph: 请勿公开完整学号、证件号码或手机号。认领时核对物品细节，在校园公共场所交接。
